<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário Informativo</title>
</head>
<body>

    <h1>Receba Informações sobre Vacinação</h1>

    <p>Preencha o formulário para receber campanhas de vacinação por e-mail.</p>

    <form>

        <label for="nome">Nome completo:</label><br>
        <input type="text" id="nome" name="nome"><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="cidade">Cidade:</label><br>
        <input type="text" id="cidade" name="cidade"><br><br>

        <input type="checkbox" id="termos" name="termos">
        <label for="termos">Desejo receber e-mails sobre campanhas de vacinação</label><br><br>

        <input type="submit" value="Cadastrar">

    </form>

</body>
</html>
